id: manual-trigger-workflow
namespace: salesforce.analytics

description: |
  Run one or more analytics workflows from the Kestra UI. Each selected
  workflow type is dispatched through the shared analytics subflow.

inputs:
  - id: workflow_types
    type: MULTISELECT
    required: true
    values:
      - sales-pipeline-health
      - rep-performance
      - revenue-forecast
    defaults:
      - sales-pipeline-health
  - id: asana_task_gid
    type: STRING
    required: false
    defaults: ""
  - id: asana_task_url
    type: STRING
    required: false
    defaults: ""

tasks:
  - id: dispatch
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ inputs.workflow_types }}"
    tasks:
      - id: run_analytics
        type: io.kestra.plugin.core.flow.Subflow
        namespace: salesforce.analytics
        flowId: analytics-workflow
        wait: true
        inputs:
          workflow_type: "{{ taskrun.value }}"
          asana_task_gid: "{{ inputs.asana_task_gid }}"
          asana_task_url: "{{ inputs.asana_task_url }}"

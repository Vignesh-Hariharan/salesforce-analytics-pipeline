id: asana-poller
namespace: salesforce.analytics

description: |
  Every 6 hours, scan the configured Asana project for incomplete tasks that
  carry a workflow tag and dispatch each one through the analytics subflow.
  This flow does not run any Python pipeline code itself — it only routes.

triggers:
  - id: every_six_hours
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */6 * * *"

tasks:
  - id: list_tasks
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    beforeCommands:
      - pip install -q requests
    outputFiles:
      - tasks.json
    script: |
      import base64, json, os
      import requests

      token = base64.b64decode(os.environ['SECRET_ASANA_ACCESS_TOKEN']).decode()
      project = base64.b64decode(os.environ['SECRET_ASANA_PROJECT_GID']).decode()

      target_tags = {'sales-pipeline-health', 'rep-performance', 'revenue-forecast'}

      resp = requests.get(
          f"https://app.asana.com/api/1.0/projects/{project}/tasks",
          headers={"Authorization": f"Bearer {token}"},
          params={"opt_fields": "name,tags.name,completed,gid,permalink_url"},
          timeout=10,
      )
      resp.raise_for_status()

      matched = []
      for task in resp.json().get('data', []):
          if task.get('completed'):
              continue
          tags = {t['name'] for t in task.get('tags', [])}
          tag = next((t for t in target_tags if t in tags), None)
          if not tag:
              continue
          matched.append({
              'workflow_type': tag,
              'asana_task_gid': task['gid'],
              'asana_task_url': task.get('permalink_url', ''),
              'name': task['name'],
          })

      print(f"Matched {len(matched)} task(s)")
      with open('tasks.json', 'w') as f:
          json.dump(matched, f)

  - id: dispatch
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ read(outputs.list_tasks.outputFiles['tasks.json']) }}"
    tasks:
      - id: run_analytics
        type: io.kestra.plugin.core.flow.Subflow
        namespace: salesforce.analytics
        flowId: analytics-workflow
        wait: true
        inputs:
          workflow_type: "{{ json(taskrun.value).workflow_type }}"
          asana_task_gid: "{{ json(taskrun.value).asana_task_gid }}"
          asana_task_url: "{{ json(taskrun.value).asana_task_url }}"

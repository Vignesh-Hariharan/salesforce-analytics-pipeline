name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r python/requirements-dev.txt
          pip install pyyaml

      - name: Lint
        run: ruff check python/ --ignore E501

      - name: Unit tests
        working-directory: python
        run: pytest -q

      - name: Validate Kestra flow YAML
        run: |
          python <<'PY'
          import os, sys, yaml
          flow_dir = 'kestra/flows'
          errors = []
          for name in sorted(os.listdir(flow_dir)):
              if not (name.endswith('.yml') or name.endswith('.yaml')):
                  continue
              path = os.path.join(flow_dir, name)
              try:
                  with open(path) as fh:
                      yaml.safe_load(fh)
                  print(f'OK   {name}')
              except yaml.YAMLError as e:
                  errors.append(f'{name}: {e}')
          if errors:
              print('YAML errors:')
              for e in errors:
                  print(' ', e)
              sys.exit(1)
          PY

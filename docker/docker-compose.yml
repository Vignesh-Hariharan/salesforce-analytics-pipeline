services:
  kestra:
    image: kestra/kestra:v1.3.23
    pull_policy: missing
    user: "root"
    command: server standalone
    volumes:
      - kestra-data:/app/storage
      - /tmp/kestra-wd:/tmp/kestra-wd
      - ../kestra/flows:/app/flows
      - ../python:/app/python
      - ../dbt:/app/dbt
      - ../outputs:/app/outputs
    environment:
      SECRET_SNOWFLAKE_ACCOUNT: "${KESTRA_SECRET_SNOWFLAKE_ACCOUNT}"
      SECRET_SNOWFLAKE_USER: "${KESTRA_SECRET_SNOWFLAKE_USER}"
      SECRET_SNOWFLAKE_PASSWORD: "${KESTRA_SECRET_SNOWFLAKE_PASSWORD}"
      SECRET_SALESFORCE_USERNAME: "${KESTRA_SECRET_SALESFORCE_USERNAME}"
      SECRET_SALESFORCE_PASSWORD: "${KESTRA_SECRET_SALESFORCE_PASSWORD}"
      SECRET_SALESFORCE_SECURITY_TOKEN: "${KESTRA_SECRET_SALESFORCE_SECURITY_TOKEN}"
      SECRET_SALESFORCE_DOMAIN: "${KESTRA_SECRET_SALESFORCE_DOMAIN}"
      SECRET_GEMINI_API_KEY: "${KESTRA_SECRET_GEMINI_API_KEY}"
      SECRET_SLACK_WEBHOOK_URL: "${KESTRA_SECRET_SLACK_WEBHOOK_URL}"
      SECRET_ASANA_ACCESS_TOKEN: "${KESTRA_SECRET_ASANA_ACCESS_TOKEN}"
      SECRET_ASANA_PROJECT_GID: "${KESTRA_SECRET_ASANA_PROJECT_GID}"
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: "${KESTRA_DB_PASSWORD:-changeme}"
        kestra:
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          server:
            basic-auth:
              username: "${KESTRA_BASIC_AUTH_USERNAME:-admin@kestra.io}"
              password: "${KESTRA_BASIC_AUTH_PASSWORD:-kestra}"
          url: http://localhost:8080/
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: "${KESTRA_DB_PASSWORD:-changeme}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kestra-data:
  postgres-data:
